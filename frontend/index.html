<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>API Demo</title>

    <style>
        *{
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, Helvetica, sans-serif;
        }

        body{
            background: linear-gradient(135deg, #667eea, #764ba2);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container{
            width: 100%;
            max-width: 500px;
            background: white;
            padding: 30px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
        }

        h1{
            text-align: center;
            margin-bottom: 25px;
            color: #333;
        }

        .section{
            margin-bottom: 30px;
        }

        button{
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 12px;
            background: #667eea;
            color: white;
            font-size: 16px;
            cursor: pointer;
            transition: 0.3s;
        }

        button:hover{
            background: #5a67d8;
            transform: translateY(-2px);
        }

        input{
            width: 100%;
            padding: 14px;
            border: 2px solid #ddd;
            border-radius: 12px;
            margin-bottom: 12px;
            font-size: 16px;
            outline: none;
            transition: 0.3s;
        }

        input:focus{
            border-color: #667eea;
        }

        .result{
            margin-top: 15px;
            padding: 12px;
            background: #f4f4f4;
            border-radius: 10px;
            color: #333;
            min-height: 45px;
            display: flex;
            align-items: center;
        }

        .label{
            font-weight: bold;
            margin-bottom: 10px;
            color: #555;
        }

        hr{
            margin: 25px 0;
            border: none;
            border-top: 1px solid #ddd;
        }
    </style>
</head>

<body>

    <div class="container">

        <h1>NodeJS API Demo</h1>

        <div class="section">
            <div class="label">GET API</div>

            <button id="btn">Get Data</button>

            <div class="result">
                <p id="kq"></p>
            </div>

            <div class="result">
                <p id="kq2"></p>
            </div>
        </div>

        <hr>

        <div class="section">
            <div class="label">POST API</div>

            <input type="text" id="input" placeholder="Enter your name">

            <button id="send">Send</button>

            <div class="result">
                <p id="response"></p>
            </div>
        </div>

    </div>

    <script>
        const button = document.getElementById('btn');
        const kq = document.getElementById('kq');
        const kq2 = document.getElementById('kq2');

        const input = document.getElementById('input');
        const sendButton = document.getElementById('send');
        const responseElement = document.getElementById('response');

        button.addEventListener('click', async () => {
            const response = await fetch('https://testnodejs-fpz9.onrender.com/hello',{
                method: 'GET',
                headers: {
                    'Content-Type': 'application/json'
                }
            });

            const data = await response.json();

            kq.textContent = "Name: " + data.name;
            kq2.textContent = "Message: " + data.message;
        });

        sendButton.addEventListener('click', async () => {
            const data = { name: input.value };

            const response = await fetch('https://testnodejs-fpz9.onrender.com/helloName', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify(data)
            });

            const result = await response.json();

            responseElement.textContent = result.name;
        });
    </script>

</body>
</html>
