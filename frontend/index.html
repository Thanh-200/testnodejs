<!DOCTYPE html>
<html lang="en">    
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <button id="btn">Click me</button>
    <p id="kq"></p>
    <p id="kq2"></p>
    <hr>
    <input type="text" id="input" placeholder="Enter something">
    <button id="send">Send</button>
    <p id="response"></p>
    <script>
        const button= document.getElementById('btn');
        const kq= document.getElementById('kq');
        const kq2 = document.getElementById('kq2');

        const input = document.getElementById('input');
        const sendButton = document.getElementById('send');
        const responseElement = document.getElementById('response');

        button.addEventListener('click', async () => {
            const response = await fetch('http://localhost:3000/hello',{
                method: 'GET',
                headers: {
                    'Content-Type': 'application/json'
                }
            });
            const data = await response.json();
            kq.textContent = data.name;
            kq2.textContent = data.message;
        });

        sendButton.addEventListener('click', async () => {
            const data = { name: input.value };
            const response = await fetch('http://localhost:3000/helloName', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify(data)
            });
            const result = await response.json();
            responseElement.textContent = result.name;
        });
    </script>
</body>
</html>
